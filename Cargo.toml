[workspace]
resolver = "2"
members = ["crates/core", "crates/eval", "crates/python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
agentgate-core = { path = "crates/core" }
getrandom = "0.3"
maskforge-core = { path = "../maskforge/crates/maskforge-core", default-features = false }
oc-earley = { path = "../oc-earley", default-features = false }
oc-sidememory = { path = "../oc-sidememory/crates/core", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "generate-import-lib"] }
serde = { version = "1", features = ["derive"] }
serde-json = { package = "serde_json", version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
